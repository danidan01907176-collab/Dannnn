<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELLSING — Ultimate</title>

    <meta name="description"
        content="Website fan-made modern bertema Hellsing Ultimate dengan nuansa gothic cinematic.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #050505;
            color: #f2eeee;
            overflow-x: hidden;
        }

        body::selection {
            background: #9d1111;
            color: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        /* =====================================================
           SCROLLBAR
        ===================================================== */

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #7e1111;
            border-radius: 20px;
        }

        /* =====================================================
           CURSOR
        ===================================================== */

        .cursor {
            position: fixed;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(170, 15, 15, 0.14),
                    transparent 70%
                );

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            z-index: 9999;
        }

        /* =====================================================
           NAVBAR
        ===================================================== */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            padding: 20px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(3, 3, 3, 0.62);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);
        }

        .logo {
            font-family: "Cinzel", serif;

            font-size: 25px;

            font-weight: 800;

            letter-spacing: 4px;
        }

        .logo span {
            color: #a91717;
        }

        nav {
            display: flex;

            align-items: center;

            gap: 32px;
        }

        nav a {
            position: relative;

            color:
                rgba(255,255,255,0.65);

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition: 0.3s;
        }

        nav a:hover {
            color: #fff;
        }

        nav a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -8px;

            width: 0;
            height: 1px;

            background: #a91717;

            transition: 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        .classified {
            padding:
                10px 18px;

            border:
                1px solid
                rgba(160,20,20,0.55);

            color: #d42b2b;

            background:
                rgba(120,0,0,0.1);

            border-radius: 3px;
        }

        .classified::after {
            display: none;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;

            padding:
                150px 7% 100px;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(2,2,2,0.95) 0%,
                    rgba(4,4,4,0.82) 40%,
                    rgba(4,4,4,0.25) 100%
                ),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=2200&q=90");

            background-size: cover;

            background-position: center;
        }

        .hero::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.018) 0px,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px,
                    transparent 4px
                );

            pointer-events: none;

            opacity: 0.35;
        }

        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    transparent 55%,
                    #050505 100%
                );

            pointer-events: none;
        }

        /* =====================================================
           BLOOD MOON
        ===================================================== */

        .moon {
            position: absolute;

            right: 10%;
            top: 18%;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #d85b5b,
                    #7b1010 45%,
                    #260303 72%
                );

            box-shadow:
                0 0 70px
                rgba(155,10,10,0.42);

            opacity: 0.7;

            animation:
                moonPulse 5s ease-in-out infinite;
        }

        @keyframes moonPulse {

            0%,100% {
                transform: scale(1);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.04);
                opacity: 0.82;
            }

        }

        /* =====================================================
           HERO CONTENT
        ===================================================== */

        .hero-content {
            position: relative;

            z-index: 10;

            max-width: 850px;
        }

        .classified-line {
            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 25px;

            color: #b51c1c;

            font-size: 11px;

            letter-spacing: 5px;

            text-transform: uppercase;
        }

        .classified-line::before {
            content: "";

            width: 40px;
            height: 1px;

            background: #a91717;
        }

        .hero h1 {
            font-family: "Cinzel", serif;

            font-size:
                clamp(
                    60px,
                    11vw,
                    155px
                );

            font-weight: 800;

            line-height: 0.83;

            letter-spacing: -5px;

            margin-bottom: 35px;

            text-shadow:
                0 10px 50px
                rgba(0,0,0,0.8);
        }

        .hero h1 span {
            display: block;

            color: #9d1111;

            text-shadow:
                0 0 40px
                rgba(157,17,17,0.35);
        }

        .hero-description {
            max-width: 590px;

            color:
                rgba(255,255,255,0.63);

            font-size: 16px;

            line-height: 1.9;
        }

        .hero-actions {
            display: flex;

            gap: 15px;

            margin-top: 35px;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                14px 25px;

            border-radius: 3px;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            transition: 0.35s;
        }

        .btn-red {
            background: #991313;

            color: #fff;

            box-shadow:
                0 12px 35px
                rgba(150,10,10,0.25);
        }

        .btn-red:hover {
            background: #c21b1b;

            transform:
                translateY(-4px);

            box-shadow:
                0 18px 45px
                rgba(170,10,10,0.4);
        }

        .btn-dark {
            border:
                1px solid
                rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.04);

            backdrop-filter:
                blur(10px);
        }

        .btn-dark:hover {
            border-color:
                rgba(180,30,30,0.7);

            background:
                rgba(130,0,0,0.15);

            transform:
                translateY(-4px);
        }

        /* =====================================================
           BLOOD PARTICLES
        ===================================================== */

        .particles {
            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 3;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            background: #d82a2a;

            border-radius: 50%;

            box-shadow:
                0 0 8px
                rgba(200,20,20,0.8);

            animation:
                bloodFloat
                linear
                infinite;
        }

        @keyframes bloodFloat {

            0% {
                transform:
                    translateY(110vh)
                    translateX(0);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-10vh)
                    translateX(-80px);

                opacity: 0;
            }

        }

        .p1 {
            left: 12%;
            animation-duration: 14s;
        }

        .p2 {
            left: 27%;
            animation-duration: 18s;
            animation-delay: 4s;
        }

        .p3 {
            left: 43%;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .p4 {
            left: 61%;
            animation-duration: 20s;
            animation-delay: 6s;
        }

        .p5 {
            left: 76%;
            animation-duration: 15s;
            animation-delay: 1s;
        }

        .p6 {
            left: 91%;
            animation-duration: 23s;
            animation-delay: 5s;
        }

        /* =====================================================
           SIDE LABEL
        ===================================================== */

        .side-label {
            position: absolute;

            right: 5%;

            bottom: 65px;

            z-index: 20;

            writing-mode:
                vertical-rl;

            color:
                rgba(255,255,255,0.3);

            font-size: 9px;

            letter-spacing: 5px;
        }

        /* =====================================================
           SECTION
        ===================================================== */

        section {
            position: relative;

            padding:
                120px 7%;
        }

        .section-heading {
            max-width: 700px;

            margin-bottom: 55px;
        }

        .section-number {
            color: #a91717;

            font-size: 10px;

            letter-spacing: 4px;
        }

        .section-heading h2 {
            font-family: "Cinzel", serif;

            font-size:
                clamp(
                    42px,
                    6vw,
                    75px
                );

            line-height: 1;

            margin:
                13px 0 20px;
        }

        .section-heading p {
            color:
                rgba(255,255,255,0.5);

            line-height: 1.8;
        }

        /* =====================================================
           DOSSIER
        ===================================================== */

        .dossier {
            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(120,0,0,0.1),
                    transparent 30%
                ),
                #050505;
        }

        .dossier-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .dossier-card {
            position: relative;

            min-height: 500px;

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #101010;

            transition:
                transform 0.5s,
                border-color 0.5s,
                box-shadow 0.5s;
        }

        .dossier-card:hover {
            transform:
                translateY(-10px);

            border-color:
                rgba(165,20,20,0.55);

            box-shadow:
                0 30px 70px
                rgba(0,0,0,0.5);
        }

        .dossier-card img {
            width: 100%;

            height: 100%;

            min-height: 500px;

            object-fit: cover;

            filter:
                grayscale(55%)
                contrast(1.1)
                brightness(0.72);

            transition: 0.7s;
        }

        .dossier-card:hover img {
            transform: scale(1.07);

            filter:
                grayscale(10%)
                contrast(1.1)
                brightness(0.8);
        }

        .dossier-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding: 28px;

            background:
                linear-gradient(
                    transparent 25%,
                    rgba(0,0,0,0.97)
                );
        }

        .dossier-id {
            color: #a91717;

            font-size: 10px;

            letter-spacing: 4px;
        }

        .dossier-overlay h3 {
            font-family: "Cinzel", serif;

            font-size: 32px;

            margin:
                8px 0;
        }

        .dossier-overlay p {
            color:
                rgba(255,255,255,0.55);

            font-size: 13px;

            line-height: 1.7;
        }

        .status {
            display: inline-block;

            width: fit-content;

            margin-top: 17px;

            padding:
                6px 10px;

            border:
                1px solid
                rgba(160,20,20,0.45);

            color: #c52b2b;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        /* =====================================================
           ALUCARD FEATURE
        ===================================================== */

        .alucard {
            min-height: 700px;

            display: flex;

            align-items: center;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(2,2,2,0.98) 0%,
                    rgba(3,3,3,0.88) 45%,
                    rgba(3,3,3,0.35) 100%
                ),
                url("https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=2200&q=90");

            background-size: cover;

            background-position: center;
        }

        .alucard::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 80% 50%,
                    rgba(120,0,0,0.25),
                    transparent 35%
                );
        }

        .alucard-content {
            position: relative;

            z-index: 2;

            max-width: 650px;
        }

        .alucard-content h2 {
            font-family: "Cinzel", serif;

            font-size:
                clamp(
                    50px,
                    8vw,
                    105px
                );

            line-height: 0.85;

            margin:
                15px 0 25px;

            color: #a91717;

            text-shadow:
                0 0 40px
                rgba(160,0,0,0.25);
        }

        .alucard-content p {
            color:
                rgba(255,255,255,0.6);

            line-height: 1.9;
        }

        .quote {
            margin-top: 35px;

            padding-left: 20px;

            border-left:
                2px solid #9d1111;

            color:
                rgba(255,255,255,0.8);

            font-family:
                "Cinzel",
                serif;

            font-size: 15px;

            line-height: 1.7;
        }

        /* =====================================================
           ORGANIZATION
        ===================================================== */

        .organization {
            background: #080808;
        }

        .org-layout {
            display: grid;

            grid-template-columns:
                0.8fr 1.2fr;

            gap: 70px;

            align-items: center;
        }

        .seal {
            width: 310px;
            height: 310px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(160,20,20,0.55);

            border-radius: 50%;

            position: relative;

            background:
                radial-gradient(
                    circle,
                    rgba(130,0,0,0.2),
                    transparent 60%
                );

            box-shadow:
                0 0 80px
                rgba(130,0,0,0.12);
        }

        .seal::before,
        .seal::after {
            content: "";

            position: absolute;

            inset: 20px;

            border:
                1px solid
                rgba(160,20,20,0.4);

            border-radius: 50%;
        }

        .seal::after {
            inset: 45px;
        }

        .seal-text {
            text-align: center;

            z-index: 2;
        }

        .seal-text strong {
            display: block;

            font-family: "Cinzel", serif;

            font-size: 48px;

            color: #a91717;
        }

        .seal-text span {
            display: block;

            margin-top: 5px;

            color:
                rgba(255,255,255,0.55);

            font-size: 9px;

            letter-spacing: 4px;
        }
